name: attend-monitor
services:
  main-db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pw
      POSTGRES_DB: main_db
    ports: ["5432:5432"]
    volumes:
      - main_data:/var/lib/postgresql/data
  log-db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pw
      POSTGRES_DB: log_db
    ports: ["5433:5432"]
    volumes:
      - log_data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
volumes:
  main_data:
  log_data:
